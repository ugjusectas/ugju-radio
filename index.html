    >

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "RadioStation",
        "@id": "https://ugjusectas.github.io/ugju-radio/#radio",
        "name": "ÚGJÜ RADIO",
        "alternateName": [
            "UGJU RADIO",
            "Ugju Radio"
        ],
        "description": "Independent online radio for experimental music, living archives, jamming and sounds outside the algorithm.",
        "url": "https://ugjusectas.github.io/ugju-radio/",
        "image": "https://ugjusectas.github.io/ugju-radio/images/web1.webp",
        "sameAs": [
            "https://linktr.ee/ugju.sectas"
        ],
        "parentOrganization": {
            "@type": "Organization",
            "name": "ÚGJÜ SECTAS",
            "alternateName": "UGJU SECTAS",
            "url": "https://linktr.ee/ugju.sectas"
        }
    }
    </script>

    <link rel="stylesheet" href="style.css?v=20260827-7">
    <link rel="stylesheet" href="radio-share.css?v=20260911-2">

</head>

<body>

    <main id="radio">

        <h1>ÚGJÜ RADIO</h1>

        <p class="subtitle">
            The ear that listens to the house...
        </p>

        <div id="state"></div>

        <div class="radio-visual">
            <img
                src="images/web1.webp"
                class="radio-image"
                alt="The house of ÚGJÜ RADIO"
            >

            <button
                class="window-trigger"
                id="window-trigger"
                type="button"
                aria-label="Open the upstairs window"
                disabled
            ></button>
        </div>

        <div class="player">

            <div class="live-controls" id="live-controls">
                <span
                    class="live-status"
                    id="live-status"
                    data-live="false"
                    aria-live="polite"
                >
                    <span id="live-status-label">IN CLOUDS</span>
                </span>

                <button
                    class="live-toggle"
                    id="live-toggle"
                    type="button"
                    aria-pressed="false"
                    hidden
                    disabled
                >
                    <span aria-hidden="true" id="live-toggle-icon">▶</span>
                    <span id="live-toggle-label" hidden>PLAY</span>
                </button>

                <p class="live-metadata" id="live-metadata" hidden>
                    <span
                        class="live-metadata-track"
                        id="live-metadata-track"
                    ></span>
                </p>
            </div>

            <section
                class="archive-session"
                id="archive-session"
                aria-live="polite"
                hidden
            >
                <p class="archive-session-now">
                    <span class="archive-session-track" id="archive-session-track">
                        <span id="archive-session-label">ARCHIVE</span>
                        —
                        <span id="archive-session-title"></span>
                    </span>
                </p>

                <div class="archive-session-actions">
                    <button
                        id="archive-session-toggle"
                        type="button"
                    >
                        PAUSE
                    </button>

                    <button
                        id="live-return"
                        type="button"
                    >
                        RETURN TO LIVE RADIO
                    </button>
                </div>
            </section>

            <audio
                id="archive-audio"
                preload="metadata"
                playsinline
            ></audio>

            <audio
                id="live-audio"
                preload="none"
                playsinline
            ></audio>

        </div>

        <aside class="visitor-guide">

            <p class="house-note">
                <span class="house-note-line house-note-line-one">
                    this house keeps no hours...
                </span>

                <span class="house-note-line house-note-line-two">
                    if there is nothing to listen to, come back and take another peek later
                </span>
            </p>

        </aside>

        <a
            class="manifesto-link"
            href="https://ugjusectas.github.io/ugju-radio/manifiesto.html"
        >
            MANIFESTO
        </a>

        <a
            class="archive-link"
            href="https://ugjusectas.github.io/ugju-radio/archivo.html"
        >
            ARCHIVE
        </a>

        <a
            class="room-link stay-link"
            href="https://ugjusectas.github.io/ugju-radio/fuegos.html"
            data-room-id="nine-dots"
            data-room-src="fuegos.html?inside=radio"
        >
            FUEGOS
        </a>

        <button class="radio-share" id="radio-share" type="button"
            aria-label="Share ÚGJÜ RADIO" title="Share ÚGJÜ RADIO"
            aria-haspopup="dialog" aria-controls="radio-share-panel">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 16V3m-4 4 4-4 4 4M5 12v9h14v-9"></path>
            </svg>
        </button>


        <a
            class="linktree-link"
            href="https://linktr.ee/ugju.sectas"
            aria-label="Open ÚGJÜ SECTAS on Linktree"
            title="ÚGJÜ SECTAS"
        >
            <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@v16/icons/linktree.svg"
                alt=""
                aria-hidden="true"
            >
        </a>

    </main>

    <section
        class="window-overlay"
        id="window-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="The upstairs window"
        hidden
    >
        <div class="window-photo-frame">
            <img
                class="window-photo"
                data-src="images/window-exhibit.jpg"
                alt="Inside the house of ÚGJÜ RADIO"
                decoding="async"
            >

            <button
                class="window-close"
                id="window-close"
                type="button"
                aria-label="Close"
                hidden
            >×</button>
        </div>
    </section>

    <section
        class="manifesto-overlay"
        id="manifesto-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Manifesto"
        hidden
    >
        <iframe
            id="manifesto-frame"
            title="ÚGJÜ RADIO — Manifesto"
            src="manifiesto.html?inside=radio&amp;v=20260828-1"
            loading="eager"
        ></iframe>
    </section>

    <section
        class="archive-overlay"
        id="archive-overlay"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Archive"
        hidden
    >
        <iframe
            id="archive-frame"
            title="ÚGJÜ RADIO — Archive"
            src="archivo.html?inside=radio"
            loading="eager"
        ></iframe>
    </section>

    <section
        class="room-overlay stay-overlay"
        id="stay-overlay"
        data-room-id="nine-dots"
        role="dialog"
        aria-modal="true"
        aria-label="ÚGJÜ RADIO — Fuegos"
        hidden
    >
        <iframe
            id="stay-frame"
            title="ÚGJÜ RADIO — Fuegos"
            src="fuegos.html?inside=radio"
            loading="eager"
        ></iframe>
    </section>

    <dialog class="radio-share-panel" id="radio-share-panel" aria-labelledby="radio-share-heading">
        <button class="radio-share-close" id="radio-share-close" type="button" aria-label="Close" title="Close">×</button>
        <h2 id="radio-share-heading">Share ÚGJÜ RADIO</h2>
        <div class="radio-share-qr">
            <img id="radio-share-qr" src="images/radio-qr-original.jpg"
                alt="Scan to open ÚGJÜ RADIO" width="1024" height="1024">
        </div>
        <button class="radio-share-link" id="radio-share-link" type="button" autofocus>SHARE</button>
        <button class="radio-share-link" id="radio-share-copy-link" type="button" hidden>COPY LINK</button>
        <p class="radio-share-status" id="radio-share-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </dialog>

    <script src="observatory.js?v=20260821-2"></script>
    <script src="radio-notifications.js?v=20260827-1"></script>
    <script src="script.js?v=20260919-backup-1"></script>
    <script src="radio-share.js?v=20260911-2"></script>

</body>

</html>
